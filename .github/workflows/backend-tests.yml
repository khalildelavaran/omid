name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Django checks
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_DEBUG: "True"
        run: python backend/manage.py check
      - name: Check migration consistency
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_DEBUG: "True"
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_DEBUG: "True"
        run: python backend/manage.py test
