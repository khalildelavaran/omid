name: Backend container build and smoke test

on:
  push:
    paths:
      - "backend/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-container.yml"
  pull_request:
    paths:
      - "backend/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-container.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build production image (no push)
        run: docker build --pull --tag omid-api:ci .

      - name: Start isolated PostgreSQL for container tests
        shell: bash
        run: |
          docker network create omid-ci
          docker volume create omid-documents-ci
          docker run --detach --name omid-db --network omid-ci \
            --env POSTGRES_DB=omid_ci \
            --env POSTGRES_USER=omid_ci \
            --env POSTGRES_PASSWORD=ci-only-password \
            postgres:17

          ready=0
          for attempt in $(seq 1 30); do
            if docker exec omid-db pg_isready --username=omid_ci --dbname=omid_ci; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker logs omid-db
            exit 1
          fi

      - name: Apply database migrations using production image
        run: |
          docker run --rm --network omid-ci \
            --env DJANGO_SECRET_KEY=ci-only-not-a-production-secret-000000000000000000000000000000000000 \
            --env DJANGO_DEBUG=False \
            --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            --env DJANGO_CSRF_TRUSTED_ORIGINS=https://omid.khalil-delavaran.workers.dev \
            --env DATABASE_URL=postgres://omid_ci:ci-only-password@omid-db:5432/omid_ci \
            --env PRIVATE_DOCUMENT_ROOT=/var/lib/omid/private-documents \
            --volume omid-documents-ci:/var/lib/omid/private-documents \
            omid-api:ci python manage.py migrate --noinput

      - name: Start production container
        run: |
          docker run --detach --name omid-api --network omid-ci \
            --publish 127.0.0.1:8000:8000 \
            --env PORT=8000 \
            --env DJANGO_SECRET_KEY=ci-only-not-a-production-secret-000000000000000000000000000000000000 \
            --env DJANGO_DEBUG=False \
            --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            --env DJANGO_CSRF_TRUSTED_ORIGINS=https://omid.khalil-delavaran.workers.dev \
            --env DATABASE_URL=postgres://omid_ci:ci-only-password@omid-db:5432/omid_ci \
            --env PRIVATE_DOCUMENT_ROOT=/var/lib/omid/private-documents \
            --volume omid-documents-ci:/var/lib/omid/private-documents \
            omid-api:ci

      - name: Smoke test health, secure CSRF cookie, and trusted HTTPS proxy origin
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8000/api/v1/health/ --output /tmp/omid-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker logs omid-api
            exit 1
          fi
          grep -q '"status": "ok"' /tmp/omid-health.json
          grep -q '"service": "omid-api"' /tmp/omid-health.json

          curl --silent --show-error --fail \
            --cookie-jar /tmp/omid-cookies.txt \
            --dump-header /tmp/omid-csrf-headers.txt \
            --output /tmp/omid-csrf.json \
            http://127.0.0.1:8000/api/v1/auth/csrf/
          grep -q '"csrfToken":' /tmp/omid-csrf.json
          grep -qiE 'set-cookie: csrftoken=.*secure' /tmp/omid-csrf-headers.txt
          csrf_cookie=$(grep -i '^set-cookie: csrftoken=' /tmp/omid-csrf-headers.txt | head -n 1 | sed -E 's/^[^:]*:[[:space:]]*//; s/;.*$//')
          csrf_token=$(python -c 'import json; print(json.load(open("/tmp/omid-csrf.json"))["csrfToken"])')
          test -n "$csrf_cookie"
          test -n "$csrf_token"

          me_status=$(curl --silent --show-error \
            --output /tmp/omid-me.json \
            --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/v1/auth/me/)
          if [ "$me_status" != "403" ]; then
            echo "Expected unauthenticated current-user request to be rejected with 403; got $me_status"
            cat /tmp/omid-me.json
            exit 1
          fi

          # Send the cookie explicitly so curl cannot omit it due to its Secure flag on local HTTP.
          # Without the X-CSRFToken header this request must fail even when the CSRF cookie is valid.
          login_status=$(curl --silent --show-error \
            --output /tmp/omid-login.json \
            --write-out '%{http_code}' \
            --header "Cookie: $csrf_cookie" \
            --header 'Origin: https://omid.khalil-delavaran.workers.dev' \
            --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{}' \
            http://127.0.0.1:8000/api/v1/auth/login/)
          if [ "$login_status" != "403" ]; then
            echo "Expected login without X-CSRFToken to be rejected with 403; got $login_status"
            cat /tmp/omid-login.json
            exit 1
          fi

          # A valid CSRF token should pass middleware and reach login validation (400 for empty credentials).
          valid_csrf_status=$(curl --silent --show-error \
            --output /tmp/omid-valid-csrf-login.json \
            --write-out '%{http_code}' \
            --header "Cookie: $csrf_cookie" \
            --header "X-CSRFToken: $csrf_token" \
            --header 'Origin: https://omid.khalil-delavaran.workers.dev' \
            --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{}' \
            http://127.0.0.1:8000/api/v1/auth/login/)
          if [ "$valid_csrf_status" != "400" ]; then
            echo "Expected valid CSRF token to reach login validation (400); got $valid_csrf_status"
            cat /tmp/omid-valid-csrf-login.json
            exit 1
          fi

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs omid-db || true
          docker logs omid-api || true

      - name: Cleanup
        if: always()
        run: |
          docker rm --force omid-api omid-db 2>/dev/null || true
          docker volume rm omid-documents-ci 2>/dev/null || true
          docker network rm omid-ci 2>/dev/null || true
